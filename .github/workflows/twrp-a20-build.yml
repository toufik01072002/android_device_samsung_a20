name: Build TWRP Samsung A20 with EDK2 Integration

on:
  workflow_dispatch:
    inputs:
      reuse_edk2_run_id:
        description: "Run ID contenant l'artefact EDK2 à réutiliser (vide = reconstruire)"
        required: false
        default: ""
        type: string
      edk2_ref:
        description: "Branche ou tag EDK2 à compiler"
        required: false
        default: "integrate/fd-sec-contract"
        type: string
  pull_request:
    branches:
      - android-11
    paths:
      - ".github/workflows/twrp-a20-build.yml"
  push:
    branches:
      - android-11
    paths:
      - ".github/workflows/twrp-a20-build.yml"

permissions:
  actions: read
  contents: read

jobs:
  build-edk2:
    if: ${{ inputs.reuse_edk2_run_id == '' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout EDK2 repo
        uses: actions/checkout@v4
        with:
          repository: toufik01072002/edk2-exynos7885
          ref: ${{ inputs.edk2_ref || 'integrate/fd-sec-contract' }}
          path: edk2-exynos7885
          submodules: recursive

      - name: Test Ubuntu mirror connectivity
        run: |
          set +e

          for url in \
            https://mirrors.edge.kernel.org/ubuntu \
            https://mirror.math.princeton.edu/pub/ubuntu \
            https://ubuntu.mirror.constant.com/ubuntu
          do
            echo "===== MIRROR: $url ====="

            for pocket in noble noble-updates noble-backports noble-security; do
              echo "--- $pocket ---"

              curl -sS -L \
                --connect-timeout 5 \
                --max-time 12 \
                -o /dev/null \
                -w 'HTTP_CODE=%{http_code} CONNECT=%{time_connect}s TOTAL=%{time_total}s\n' \
                "$url/dists/$pocket/InRelease"

              rc=$?
              echo "CURL_EXIT=$rc"
            done
          done

      - name: Install EDK2 dependencies
        run: |
          set -euo pipefail

          echo "===== Configure verified Ubuntu mirrors ====="

          printf '%s\tpriority:%s\n' \
            'https://mirrors.edge.kernel.org/ubuntu/' 1 \
            'https://mirror.math.princeton.edu/pub/ubuntu/' 2 \
            'https://ubuntu.mirror.constant.com/ubuntu/' 3 \
            | sudo tee /etc/apt/apt-mirrors.txt

          cat /etc/apt/apt-mirrors.txt

          echo "===== APT update ====="
          date -u
          sudo apt-get \
            -o APT::Update::Error-Mode=any \
            -o Acquire::Retries=1 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            update

          echo "===== Install EDK2 dependencies ====="
          sudo apt-get \
            -o Acquire::Retries=1 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            install -y \
              build-essential uuid-dev acpica-tools git nasm \
              python3 python3-setuptools gcc-aarch64-linux-gnu mkbootimg \
              device-tree-compiler

          sudo sed -i \
            '/^from gki\.generate_gki_certificate import generate_gki_certificate$/d' \
            /usr/bin/mkbootimg

          echo "EDK2 dependencies installed successfully"
      - name: Clone EDK2 and edk2-platforms
        run: |
          cd edk2-exynos7885
          git clone --recursive -b edk2-stable202605 https://github.com/tianocore/edk2 ../edk2
          git clone https://github.com/tianocore/edk2-platforms.git ../edk2-platforms
          test -f ../edk2/edksetup.sh
          echo "EDK2 setup verified"

      - name: Build EDK2
        working-directory: edk2-exynos7885
        run: |
          chmod +x *.sh
          ./firstrun.sh
          ./build.sh

      - name: Validate 7K-EDK2-BUNDLE and SEC metadata
        working-directory: edk2-exynos7885/workspace
        run: |
          set -euo pipefail
          ls -lh
          python3 ../tools/verify_bundle.py
          python3 ../BootShim/validate_prepi_entry.py
          test -s UEFI
          test -s UEFI.manifest.json
          test -s UEFI.sec-manifest.json
          sha256sum UEFI UEFI.manifest.json UEFI.sec-manifest.json > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Prepare EDK2 bundle artifact
        working-directory: edk2-exynos7885
        run: |
          set -euo pipefail
          mkdir -p artifact-staging
          cp workspace/UEFI workspace/UEFI.manifest.json \
            workspace/UEFI.sec-manifest.json workspace/SHA256SUMS artifact-staging/
          (cd artifact-staging && sha256sum -c SHA256SUMS)
          ls -lh artifact-staging/

      - name: Upload EDK2 bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: a205w-edk2
          path: |
            edk2-exynos7885/artifact-staging/
          retention-days: 7

  build-twrp:
    needs: build-edk2
    if: ${{ always() && (needs.build-edk2.result == 'success' || needs.build-edk2.result == 'skipped') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          sudo docker system prune -af || true
          sudo apt-get clean
          df -h /

      - name: Retry Ubuntu APT update
        run: |
          set -e
          for attempt in 1 2 3 4 5; do
            echo "APT update attempt $attempt/5"
            if sudo apt-get update; then
              exit 0
            fi
            sleep 15
          done
          echo "APT update failed after 5 attempts"
          exit 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl \
            flex g++-multilib gcc-multilib git git-lfs \
            gnupg gperf imagemagick lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool \
            libncurses5-dev libssl-dev libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3 python-is-python3 \
            openjdk-11-jdk autoconf automake libtool

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize TWRP
        run: |
          mkdir -p ~/twrp
          cd ~/twrp
          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-11

      - name: Synchronize sources
        run: |
          cd ~/twrp
          repo sync -c --no-clone-bundle --no-tags -j2

      - name: Download EDK2 artifacts from previous run
        if: ${{ inputs.reuse_edk2_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: a205w-edk2
          path: edk2-artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.reuse_edk2_run_id }}

      - name: Download EDK2 artifacts from current run
        if: ${{ inputs.reuse_edk2_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          name: a205w-edk2
          path: edk2-artifacts

      - name: Clone Samsung A20 device tree
        run: |
          cd ~/twrp
          mkdir -p device/samsung
          git clone --depth=1 -b android-11 \
            https://github.com/toufik01072002/android_device_samsung_a20.git \
            device/samsung/a20

      - name: Install Android SDK in runner home
        run: |
          mkdir -p "$HOME/android-sdk"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"

      - name: Setup JDK 17 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install NDK toolchain
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          sdkmanager --sdk_root="$ANDROID_HOME" "ndk;27.2.12479018"

      - name: Build Zinitix A20 touchscreen firmware
        run: |
          set -euo pipefail

          KERNEL_DIR="$HOME/kernel-firmware-src"
          DEVICE_DIR="$HOME/twrp/device/samsung/a20"
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          OBJCOPY="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objcopy"

          git clone --depth=1 -b kexec-arm64-4.4-d-work \
            https://github.com/toufik01072002/Kernel_SM-A205W.git \
            "$KERNEL_DIR"

          SRC="$KERNEL_DIR/firmware/tsp_zinitix/zt7548_a20.fw.ihex"
          DEST="$DEVICE_DIR/prebuilt/firmware/tsp_zinitix/zt7548_a20.fw"

          test -s "$SRC"
          test -x "$OBJCOPY"

          mkdir -p "$(dirname "$DEST")"
          "$OBJCOPY" -Iihex -Obinary "$SRC" "$DEST"

          test -s "$DEST"
          chmod 0644 "$DEST"

          echo "===== ZINITIX FIRMWARE ====="
          ls -lh "$DEST"
          sha256sum "$DEST"

      - name: Build A20 KEXEC kernel and validate DTB
        run: |
          set -euo pipefail

          KERNEL_DIR="$HOME/kernel-firmware-src"
          DEVICE_DIR="$HOME/twrp/device/samsung/a20"
          OUT="$RUNNER_TEMP/a20-kexec-out"
          STAGE="$RUNNER_TEMP/a20-kexec-artifacts"
          TOOLCHAIN="$KERNEL_DIR/toolchain"

          test -d "$KERNEL_DIR"
          test -s "$KERNEL_DIR/arch/arm64/configs/exynos7885-a20_defconfig"
          test -s "$KERNEL_DIR/init/uh.elf"
          test -s "$KERNEL_DIR/firmware/exynos7885_acpm_fvp.fw"
          test -s "$DEVICE_DIR/prebuilt/kexec/Image"
          test -s "$DEVICE_DIR/prebuilt/kexec/exynos7885.dtb"

          mkdir -p "$TOOLCHAIN" "$OUT/init" "$OUT/firmware" "$STAGE"

          echo "===== Install Android GCC 4.9 ====="
          wget -q \
            "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/423c0265176bcabd1c885f8cf6f0cedf67d3f59b.tar.gz" \
            -O "$RUNNER_TEMP/gcc49.tar.gz"
          tar -xzf "$RUNNER_TEMP/gcc49.tar.gz" -C "$TOOLCHAIN"
          test -x "$TOOLCHAIN/bin/aarch64-linux-android-gcc"
          export PATH="$TOOLCHAIN/bin:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export ANDROID_MAJOR_VERSION=p

          aarch64-linux-android-gcc --version

          echo "===== Configure KEXEC kernel ====="
          make -C "$KERNEL_DIR" O="$OUT" \
            ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" \
            exynos7885-a20_defconfig
          make -C "$KERNEL_DIR" O="$OUT" \
            ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" \
            olddefconfig
          grep -qx 'CONFIG_KEXEC=y' "$OUT/.config"

          echo "===== Prepare out-of-tree embedded binaries ====="
          cp "$KERNEL_DIR/init/uh.elf" "$OUT/init/uh.elf"
          cp "$KERNEL_DIR/firmware/exynos7885_acpm_fvp.fw" \
            "$OUT/firmware/exynos7885_acpm_fvp.fw"

          echo "===== Compile ARM64 Image and DTBs ====="
          make -C "$KERNEL_DIR" -j2 O="$OUT" \
            HOSTCFLAGS=-fcommon ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" Image dtbs

          IMAGE="$OUT/arch/arm64/boot/Image"
          test -s "$IMAGE"
          test -s "$OUT/vmlinux"
          test -s "$OUT/System.map"

          DTB_COUNT=$(find "$OUT/arch/arm64/boot/dts" -type f \
            -name 'exynos7885.dtb' | wc -l)
          if [ "$DTB_COUNT" -ne 1 ]; then
            echo "Expected exactly one exynos7885.dtb, found: $DTB_COUNT"
            find "$OUT/arch/arm64/boot/dts" -type f -name '*.dtb' -print
            exit 1
          fi
          DTB=$(find "$OUT/arch/arm64/boot/dts" -type f \
            -name 'exynos7885.dtb' -print -quit)
          test -s "$DTB"

          cp "$IMAGE" "$STAGE/Image.kexec"
          cp "$DTB" "$STAGE/exynos7885.dtb"
          cp "$OUT/.config" "$STAGE/kernel.config"
          cp "$OUT/vmlinux" "$STAGE/vmlinux"
          cp "$OUT/System.map" "$STAGE/System.map"
          cp "$DEVICE_DIR/prebuilt/kexec/Image" "$STAGE/Image.prebuilt"
          cp "$DEVICE_DIR/prebuilt/kexec/exynos7885.dtb" \
            "$STAGE/exynos7885.prebuilt.dtb"

          echo "===== DTB compatibility gate ====="
          BUILT_DTB_SHA=$(sha256sum "$DTB" | cut -d' ' -f1)
          PREBUILT_DTB_SHA=$(sha256sum \
            "$DEVICE_DIR/prebuilt/kexec/exynos7885.dtb" | cut -d' ' -f1)
          echo "BUILT_DTB_SHA=$BUILT_DTB_SHA"
          echo "PREBUILT_DTB_SHA=$PREBUILT_DTB_SHA"
          {
            echo "Kernel repository: toufik01072002/Kernel_SM-A205W"
            echo "Kernel branch: kexec-arm64-4.4-d-work"
            echo "Kernel commit: $(git -C "$KERNEL_DIR" rev-parse HEAD)"
            echo "Toolchain: Android GCC 4.9"
            echo "ANDROID_MAJOR_VERSION=$ANDROID_MAJOR_VERSION"
            echo "Built DTB: $DTB"
            echo "Built DTB SHA256: $BUILT_DTB_SHA"
            echo "Prebuilt DTB SHA256: $PREBUILT_DTB_SHA"
          } > "$STAGE/build-info.txt"

          if [ "$BUILT_DTB_SHA" != "$PREBUILT_DTB_SHA" ]; then
            echo "::error::Compiled DTB differs from the TWRP prebuilt DTB."
            echo "Stopping before replacing the recovery kernel."
            exit 1
          fi

          echo "===== DTB matches; stage new kernel for this runner only ====="
          ORIGINAL_IMAGE_SHA=$(sha256sum \
            "$DEVICE_DIR/prebuilt/kexec/Image" | cut -d' ' -f1)
          BUILT_IMAGE_SHA=$(sha256sum "$IMAGE" | cut -d' ' -f1)
          cp "$IMAGE" "$DEVICE_DIR/prebuilt/kexec/Image"
          test "$(sha256sum "$DEVICE_DIR/prebuilt/kexec/Image" | cut -d' ' -f1)" \
            = "$BUILT_IMAGE_SHA"
          {
            echo "Original TWRP kernel SHA256: $ORIGINAL_IMAGE_SHA"
            echo "Injected KEXEC kernel SHA256: $BUILT_IMAGE_SHA"
          } >> "$STAGE/build-info.txt"
          sha256sum "$STAGE"/Image.kexec "$STAGE"/exynos7885.dtb \
            "$STAGE"/Image.prebuilt "$STAGE"/exynos7885.prebuilt.dtb \
            > "$STAGE/SHA256SUMS"

          echo "KEXEC kernel built and DTB gate passed."
          cat "$STAGE/build-info.txt"

      - name: Upload KEXEC kernel validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A20-KEXEC-kernel-validation
          path: ${{ runner.temp }}/a20-kexec-artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Build kexec-tools for Android ARM64
        run: |
          set -euo pipefail

          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          CC="$TC/bin/clang"

          curl -fsSL https://cdn.kernel.org/pub/linux/utils/kernel/kexec/kexec-tools-2.0.32.tar.xz -o /tmp/kexec-tools.tar.xz

          mkdir -p /tmp/kexec-build
          tar -xJf /tmp/kexec-tools.tar.xz -C /tmp/kexec-build
          cd /tmp/kexec-build/kexec-tools-2.0.32

          export CC="$CC"
          export CFLAGS="--target=aarch64-linux-android24 -O2 -fPIE"
          export LDFLAGS="-pie"

          ./configure \
            --build="$(gcc -dumpmachine)" \
            --host=aarch64-linux-android \
            --without-xen \
            --without-zlib \
            --without-lzma \
            --without-zstd

          echo "===== BUILD WITH ARM64 PURGATORY COMPILER ====="
          echo "===== ARM64 PURGATORY TOOLCHAIN ====="
          "$TC/bin/llvm-strip" --version
          make TARGET_CC="$TC/bin/clang --target=aarch64-linux-android24" STRIP="$TC/bin/llvm-strip" -j2

          echo "===== SEARCH KEXEC ====="
          find . -type f -name kexec -print

          KEXEC_BIN="$(find . -type f -name kexec -perm -111 | head -n1)"
          test -n "$KEXEC_BIN"

          "$TC/bin/llvm-strip" "$KEXEC_BIN"

          readelf -h "$KEXEC_BIN" | grep -q "AArch64"

          DEST="$HOME/twrp/device/samsung/a20/prebuilt/kexec"
          mkdir -p "$DEST"
          install -m 0755 "$KEXEC_BIN" "$DEST/kexec"

          test -x "$DEST/kexec"
          file "$DEST/kexec"
          sha256sum "$DEST/kexec"

      - name: Verify EDK2 bundle artifact
        run: |
          set -euo pipefail
          ls -lh edk2-artifacts/
          for file in UEFI UEFI.manifest.json UEFI.sec-manifest.json SHA256SUMS; do
            test -s "edk2-artifacts/$file"
          done
          (cd edk2-artifacts && sha256sum -c SHA256SUMS)

      - name: Install 7K-EDK2-BUNDLE in device tree
        run: |
          set -euo pipefail
          DEST=~/twrp/device/samsung/a20/prebuilt/etc/edk2
          mkdir -p "$DEST"
          cp edk2-artifacts/UEFI edk2-artifacts/UEFI.manifest.json \
            edk2-artifacts/UEFI.sec-manifest.json edk2-artifacts/SHA256SUMS "$DEST/"
          (cd "$DEST" && sha256sum -c SHA256SUMS)
          ls -lh "$DEST/"

      - name: Use custom TWRP recovery source
        run: |
          cd ~/twrp
          rm -rf bootable/recovery
          git clone --depth=1 -b edk2-integration \
            https://github.com/toufik01072002/android_bootable_recovery.git \
            bootable/recovery

      - name: Point TWRP EDK2 validation to the UEFI bundle
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path.home() / "twrp/bootable/recovery/gui/action.cpp"
          s = p.read_text()
          old = 'const char* edk2_image_path = "/system/etc/edk2/boot.img";'
          new = 'const char* edk2_image_path = "/system/etc/edk2/UEFI";'
          if old not in s:
              raise SystemExit("Expected legacy EDK2 path not found in GUI source")
          p.write_text(s.replace(old, new, 1))
          print("TWRP GUI now validates /system/etc/edk2/UEFI")
          PY
          grep -n 'edk2_image_path' ~/twrp/bootable/recovery/gui/action.cpp

      - name: Restore JDK 11 for TWRP
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Compile recovery
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_a20-eng
          mka recoveryimage -j2

      - name: Verify recovery image contains EDK2 files
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y abootimg cpio gzip lz4 xz-utils zstd bzip2 lzop

          mkdir -p /tmp/recovery_extract
          cd /tmp/recovery_extract

          RECOVERY=~/twrp/out/target/product/a20/recovery.img
          test -s "$RECOVERY"
          abootimg -x "$RECOVERY"

          echo "===== RAMDISK FORMAT ====="
          file initrd.img
          MAGIC=$(od -An -tx1 -N6 initrd.img | tr -d ' \\n')
          echo "Magic: $MAGIC"

          case "$MAGIC" in
            1f8b*) gzip -dc initrd.img > ramdisk.cpio ;;
            04224d18*|02214c18*) lz4 -dc initrd.img > ramdisk.cpio ;;
            fd377a585a00*) xz -dc initrd.img > ramdisk.cpio ;;
            28b52ffd*) zstd -dc initrd.img > ramdisk.cpio ;;
            425a68*) bzip2 -dc initrd.img > ramdisk.cpio ;;
            894c5a4f*) lzop -dc initrd.img > ramdisk.cpio ;;
            303730373031*|303730373032*) cp initrd.img ramdisk.cpio ;;
            *)
              echo "ERROR: Unsupported ramdisk format"
              od -An -tx1 -N16 initrd.img
              exit 1
              ;;
          esac

          mkdir ramdisk
          cd ramdisk
          cpio -idm --no-absolute-filenames < ../ramdisk.cpio

          echo "===== EDK2 FILES ====="
          find . -type f | grep -E 'UEFI|edk2_verify.sh' || true

          test -s system/etc/edk2/UEFI
          test -s system/etc/edk2/UEFI.manifest.json
          test -s system/etc/edk2/UEFI.sec-manifest.json
          test -s system/etc/edk2/SHA256SUMS
          test -s system/bin/edk2_verify.sh
          (cd system/etc/edk2 && sha256sum -c SHA256SUMS)

          echo "SUCCESS: EDK2 files verified in recovery ramdisk"
          file system/etc/edk2/UEFI

      - name: Generate recovery SHA256
        run: |
          sha256sum ~/twrp/out/target/product/a20/recovery.img > ~/twrp/out/target/product/a20/recovery.img.sha256
          cat ~/twrp/out/target/product/a20/recovery.img.sha256

      - name: Upload recovery image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-A20-recovery
          path: |
            ~/twrp/out/target/product/a20/recovery.img
            ~/twrp/out/target/product/a20/recovery.img.sha256
          if-no-files-found: warn
          retention-days: 7
