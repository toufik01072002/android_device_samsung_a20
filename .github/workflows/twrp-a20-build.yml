name: Build TWRP Samsung A20 with EDK2 Integration

on:
  workflow_dispatch:
  push:
    branches:
      - android-11
    paths:
      - ".github/workflows/twrp-a20-build.yml"

permissions:
  contents: read

jobs:
  build-edk2:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout EDK2 repo
        uses: actions/checkout@v4
        with:
          repository: toufik01072002/edk2-exynos7885
          path: edk2-exynos7885
          submodules: recursive

      - name: Install EDK2 dependencies
        run: |
          set -euo pipefail

          echo "===== Configure Ubuntu mirrors ====="
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt
            cat /etc/apt/apt-mirrors.txt
          fi

          for f in /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] || continue
            sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$f"
          done

          echo "===== APT update ====="
          date -u
          sudo apt-get \
            -o APT::Update::Error-Mode=any \
            -o Acquire::Retries=1 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            update

          echo "===== Install EDK2 dependencies ====="
          sudo apt-get \
            -o Acquire::Retries=1 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            install -y \
              build-essential uuid-dev acpica-tools git nasm \
              python3 python3-setuptools gcc-aarch64-linux-gnu mkbootimg \
              device-tree-compiler

          sudo sed -i \
            '/^from gki\.generate_gki_certificate import generate_gki_certificate$/d' \
            /usr/bin/mkbootimg

          echo "EDK2 dependencies installed successfully"
      - name: Clone EDK2 and edk2-platforms
        run: |
          cd edk2-exynos7885
          git clone --recursive -b edk2-stable202605 https://github.com/tianocore/edk2 ../edk2
          git clone https://github.com/tianocore/edk2-platforms.git ../edk2-platforms
          test -f ../edk2/edksetup.sh
          echo "EDK2 setup verified"

      - name: Build EDK2
        working-directory: edk2-exynos7885
        run: |
          chmod +x *.sh
          ./firstrun.sh
          ./build.sh

      - name: Verify EDK2 boot.img
        working-directory: edk2-exynos7885
        run: |
          ls -la workspace/
          file workspace/boot.img
          # Verify Android boot magic
          dd if=workspace/boot.img bs=8 count=1 2>/dev/null | grep -q "ANDROID!" && echo "Boot magic OK" || (echo "Invalid boot image" && exit 1)
          # Read page_size from header (offset 0x24, 4 bytes LE)
          PAGE_SIZE=$(dd if=workspace/boot.img bs=1 skip=36 count=4 2>/dev/null | od -An -tx4 | tr -d ' \n')
          PAGE_SIZE=$((16#$PAGE_SIZE))
          echo "Page size: $PAGE_SIZE"
          if [ $PAGE_SIZE -ne 2048 ] && [ $PAGE_SIZE -ne 4096 ]; then
            echo "Unexpected page size: $PAGE_SIZE"
            exit 1
          fi
          # Extract kernel size (offset 0x08, 4 bytes LE) - Android boot header v0
          KERNEL_SIZE=$(dd if=workspace/boot.img bs=1 skip=8 count=4 2>/dev/null | od -An -tx4 | tr -d ' \n')
          KERNEL_SIZE=$((16#$KERNEL_SIZE))
          echo "Kernel size: $KERNEL_SIZE bytes"
          if [ $KERNEL_SIZE -lt 1048576 ] || [ $KERNEL_SIZE -gt 16777216 ]; then
            echo "Kernel size out of range"
            exit 1
          fi
          # Check for BootShim magic at offset 0x38 from kernel start (4 bytes: 41 52 4d 64 = "ARMd" = 0x644D5241 LE)
          KERNEL_START=$PAGE_SIZE
          BOOTSHIM_OFFSET=$((KERNEL_START + 0x38))
          dd if=workspace/boot.img bs=1 skip=$BOOTSHIM_OFFSET count=4 2>/dev/null | od -An -tx1 | grep -q "41 52 4d 64" && echo "BootShim magic found at offset 0x38" || (echo "BootShim magic not found at offset 0x38" && exit 1)
          # Search for _FVH signature in the kernel region (after kernel header)
          # Search from kernel start + 0x38 to kernel start + kernel_size
          dd if=workspace/boot.img bs=1 skip=$((KERNEL_START + 0x38)) count=$((KERNEL_SIZE - 0x38)) 2>/dev/null | grep -q "_FVH" && echo "UEFI FD signature (_FVH) found" || (echo "UEFI FD signature not found" && exit 1)

      - name: Prepare artifact staging
        working-directory: edk2-exynos7885
        run: |
          mkdir -p artifact-staging
          cp workspace/UEFI artifact-staging/
          cp workspace/boot.img artifact-staging/
          cp workspace/boot.tar artifact-staging/
          ls -la artifact-staging/

      - name: Generate SHA256SUMS
        working-directory: edk2-exynos7885
        run: |
          cd artifact-staging
          sha256sum UEFI boot.img boot.tar > SHA256SUMS
          cat SHA256SUMS

      - name: Upload EDK2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edk2-artifacts
          path: |
            edk2-exynos7885/artifact-staging/
          retention-days: 7

  build-twrp:
    needs: build-edk2
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          sudo docker system prune -af || true
          sudo apt-get clean
          df -h /

      - name: Retry Ubuntu APT update
        run: |
          set -e
          for attempt in 1 2 3 4 5; do
            echo "APT update attempt $attempt/5"
            if sudo apt-get update; then
              exit 0
            fi
            sleep 15
          done
          echo "APT update failed after 5 attempts"
          exit 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl \
            flex g++-multilib gcc-multilib git git-lfs \
            gnupg gperf imagemagick lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool \
            libncurses5-dev libssl-dev libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3 python-is-python3 \
            openjdk-11-jdk autoconf automake libtool

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize TWRP
        run: |
          mkdir -p ~/twrp
          cd ~/twrp
          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-11

      - name: Synchronize sources
        run: |
          cd ~/twrp
          repo sync -c --no-clone-bundle --no-tags -j2

      - name: Download EDK2 artifacts
        uses: actions/download-artifact@v4
        with:
          name: edk2-artifacts
          path: edk2-artifacts

      - name: Clone Samsung A20 device tree
        run: |
          cd ~/twrp
          mkdir -p device/samsung
          git clone --depth=1 -b android-11 \
            https://github.com/toufik01072002/android_device_samsung_a20.git \
            device/samsung/a20

      - name: Install Android SDK in runner home
        run: |
          mkdir -p "$HOME/android-sdk"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"

      - name: Setup JDK 17 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install NDK toolchain
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          sdkmanager --sdk_root="$ANDROID_HOME" "ndk;27.2.12479018"

      - name: Build kexec-tools for Android ARM64
        run: |
          set -euo pipefail

          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          CC="$TC/bin/clang"

          curl -fsSL https://cdn.kernel.org/pub/linux/utils/kernel/kexec/kexec-tools-2.0.32.tar.xz -o /tmp/kexec-tools.tar.xz

          mkdir -p /tmp/kexec-build
          tar -xJf /tmp/kexec-tools.tar.xz -C /tmp/kexec-build
          cd /tmp/kexec-build/kexec-tools-2.0.32

          export CC="$CC"
          export CFLAGS="--target=aarch64-linux-android24 -O2 -fPIE"
          export LDFLAGS="-pie"

          ./configure \
            --build="$(gcc -dumpmachine)" \
            --host=aarch64-linux-android \
            --without-xen \
            --without-zlib \
            --without-lzma \
            --without-zstd

          echo "===== BUILD WITH ARM64 PURGATORY COMPILER ====="
          echo "===== ARM64 PURGATORY TOOLCHAIN ====="
          "$TC/bin/llvm-strip" --version
          make TARGET_CC="$TC/bin/clang --target=aarch64-linux-android24" STRIP="$TC/bin/llvm-strip" -j2

          echo "===== SEARCH KEXEC ====="
          find . -type f -name kexec -print

          KEXEC_BIN="$(find . -type f -name kexec -perm -111 | head -n1)"
          test -n "$KEXEC_BIN"

          "$TC/bin/llvm-strip" "$KEXEC_BIN"

          readelf -h "$KEXEC_BIN" | grep -q "AArch64"

          DEST="$GITHUB_WORKSPACE/device/samsung/a20/prebuilt/kexec"
          mkdir -p "$DEST"
          install -m 0755 "$KEXEC_BIN" "$DEST/kexec"

          test -x "$DEST/kexec"
          file "$DEST/kexec"
          sha256sum "$DEST/kexec"

      - name: Verify EDK2 artifacts exist
        run: |
          ls -la edk2-artifacts/
          test -f edk2-artifacts/boot.img || (echo "boot.img not found in artifacts" && exit 1)
          test -f edk2-artifacts/SHA256SUMS || (echo "SHA256SUMS not found" && exit 1)

      - name: Verify EDK2 artifacts checksums
        run: |
          cd edk2-artifacts
          sha256sum -c SHA256SUMS && echo "All checksums verified" || (echo "Checksum verification failed" && exit 1)

      - name: Copy EDK2 boot.img to device tree prebuilt
        run: |
          mkdir -p ~/twrp/device/samsung/a20/prebuilt/etc/edk2
          cp edk2-artifacts/boot.img ~/twrp/device/samsung/a20/prebuilt/etc/edk2/boot.img
          # Verify copy integrity: compare SHA256 of original and copy
          ORIGINAL_SHA256=$(sha256sum edk2-artifacts/boot.img | cut -d' ' -f1)
          COPY_SHA256=$(sha256sum ~/twrp/device/samsung/a20/prebuilt/etc/edk2/boot.img | cut -d' ' -f1)
          if [ "$ORIGINAL_SHA256" = "$COPY_SHA256" ]; then
            echo "Copy verified: SHA256 matches"
          else
            echo "Copy verification failed: SHA256 mismatch"
            echo "Original: $ORIGINAL_SHA256"
            echo "Copy:     $COPY_SHA256"
            exit 1
          fi
          ls -la ~/twrp/device/samsung/a20/prebuilt/etc/edk2/

      - name: Use custom TWRP recovery source
        run: |
          cd ~/twrp
          rm -rf bootable/recovery
          git clone --depth=1 -b edk2-integration \
            https://github.com/toufik01072002/android_bootable_recovery.git \
            bootable/recovery

      - name: Restore JDK 11 for TWRP
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Compile recovery
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_a20-eng
          mka recoveryimage -j2

      - name: Verify recovery image contains EDK2 files
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y abootimg cpio gzip lz4 xz-utils zstd bzip2 lzop

          mkdir -p /tmp/recovery_extract
          cd /tmp/recovery_extract

          RECOVERY=~/twrp/out/target/product/a20/recovery.img
          test -s "$RECOVERY"
          abootimg -x "$RECOVERY"

          echo "===== RAMDISK FORMAT ====="
          file initrd.img
          MAGIC=$(od -An -tx1 -N6 initrd.img | tr -d ' \\n')
          echo "Magic: $MAGIC"

          case "$MAGIC" in
            1f8b*) gzip -dc initrd.img > ramdisk.cpio ;;
            04224d18*|02214c18*) lz4 -dc initrd.img > ramdisk.cpio ;;
            fd377a585a00*) xz -dc initrd.img > ramdisk.cpio ;;
            28b52ffd*) zstd -dc initrd.img > ramdisk.cpio ;;
            425a68*) bzip2 -dc initrd.img > ramdisk.cpio ;;
            894c5a4f*) lzop -dc initrd.img > ramdisk.cpio ;;
            303730373031*|303730373032*) cp initrd.img ramdisk.cpio ;;
            *)
              echo "ERROR: Unsupported ramdisk format"
              od -An -tx1 -N16 initrd.img
              exit 1
              ;;
          esac

          mkdir ramdisk
          cd ramdisk
          cpio -idm --no-absolute-filenames < ../ramdisk.cpio

          echo "===== EDK2 FILES ====="
          find . -type f | grep -E 'boot.img|edk2_verify.sh' || true

          test -s system/etc/edk2/boot.img
          test -s system/bin/edk2_verify.sh

          echo "SUCCESS: EDK2 files verified in recovery ramdisk"
          file system/etc/edk2/boot.img

      - name: Generate recovery SHA256
        run: |
          sha256sum ~/twrp/out/target/product/a20/recovery.img > ~/twrp/out/target/product/a20/recovery.img.sha256
          cat ~/twrp/out/target/product/a20/recovery.img.sha256

      - name: Upload recovery image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-A20-recovery
          path: |
            ~/twrp/out/target/product/a20/recovery.img
            ~/twrp/out/target/product/a20/recovery.img.sha256
          if-no-files-found: warn
          retention-days: 7